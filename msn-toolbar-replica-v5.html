<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Toolbar Replica V5 - "Blue Line" Blueprint</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        .preview-container {
            width: 600px;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            /* Importante: para que el SVG no se corte */
            position: relative;
            z-index: 1;
        }

        /* --- TOOLBAR COMPONENT --- */
        .msn-toolbar-container {
            position: relative;
            height: 58px;
            width: 100%;
            background: #eef3fa;
            /* Fondo azul pálido del "cielo" */
            overflow: hidden;
        }

        /* SVG BACKGROUND */
        .msn-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 102%;
            /* Un poco más ancho para evitar gaps */
            height: 100%;
            z-index: 1;
        }

        /* ICON LAYERS */
        .msn-icons-layer {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            height: 100%;
            padding-left: 5px;
        }

        /* Main Icons (Left - Tall Area) */
        .msn-main-icons {
            display: flex;
            gap: 2px;
            padding-top: 3px;
        }

        .msn-btn-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #0b1f3c;
            font-size: 10px;
            font-family: Tahoma, sans-serif;
            width: 53px;
            height: 48px;
            border-radius: 3px;
            transition: all 0.1s;
        }

        /* Efecto Hover estilo Botón XP */
        .msn-btn-tool:hover {
            background: linear-gradient(to bottom, #fff 0%, #eef3fa 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 3px rgba(255, 255, 255, 1);
        }

        .msn-btn-tool img {
            width: 27px;
            height: 27px;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
        }

        /* Secondary Icons (Right - Top "Shelf" Area) */
        .msn-secondary-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Posicionamiento absoluto para control total sobre la curva */
            position: absolute;
            right: 80px;
            top: 6px;
            /* En la parte alta/fina */
            z-index: 3;
        }

        .btn-secondary-wrapper {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
            border: 1px solid #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-secondary-wrapper:hover {
            filter: brightness(1.1);
        }

        .msn-small-icon {
            width: 12px;
            height: 12px;
        }

        .msn-branding {
            position: absolute;
            right: 15px;
            top: 6px;
            z-index: 2;
        }

        .msn-branding img {
            height: 16px;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.8));
        }
    </style>
</head>

<body>

    <div class="preview-container">
        <!-- HEADER PLACEHOLDER -->
        <div style="height:30px; background:linear-gradient(to bottom, #0058E6, #0049b0); border-radius: 5px 5px 0 0;">
        </div>
        <div style="height:22px; background:#ECE9D8; border-bottom:1px solid #d4d0c8;"></div>

        <!-- *** TOOLBAR V5 *** -->
        <div class="msn-toolbar-container">

            <svg class="msn-svg-bg" viewBox="0 0 600 58" preserveAspectRatio="none">
                <defs>
                    <!-- Gradiente con más "cuerpo" vertical -->
                    <linearGradient id="plasticGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="45%" stop-color="#f4f8fe" />
                        <stop offset="100%" stop-color="#daecf6" />
                    </linearGradient>

                    <!-- Sombra INTERIOR para dar volumen en el borde -->
                    <filter id="innerGlow">
                        <feGaussianBlur stdDeviation="1.5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k2="-1" k3="1"
                            result="shadowDiff" />
                        <feFlood flood-color="white" flood-opacity="0.7" />
                        <feComposite in2="shadowDiff" operator="in" />
                        <feComposite in2="SourceGraphic" operator="over" />
                    </filter>
                </defs>

                <!-- 
                   PATH BLUEPRINT:
                   - Top: Recto (y=0)
                   - Izquierda: Pared recta (x=0)
                   - Fondo Izquierda: Línea recta hasta x=360 (y=53) [Esta es la línea azul inferior]
                   - CURVA ESCALÓN (Step Up): Sube de 53 a 28
                     Usamos curvas Bezier C para hacer la "S" suave pero marcada
                   - Fondo Derecha: Línea recta alta (y=28)
                   - Derecha: Pared recta (x=600)
                   - Cierre: Vuelta al origen.
                -->
                <path d="
                    M -1,0         <!-- Start Top-Left (overlap border) -->
                    L 601,0        <!-- Top Edge -->
                    L 601,28       <!-- Right Wall Down to Thin Level -->
                    L 470,28       <!-- Bottom Edge Right (Thin Strip) -->
                    C 450,28 440,30 420,53  <!-- THE CURVE: Drops down from right to left (28 -> 53) -->
                    L -1,53        <!-- Bottom Edge Left (Thick Strip) -->
                    Z" fill="url(#plasticGradient)" stroke="#8AA7D8" stroke-width="1.2" />

                <!-- Highlight Stroke (Top Gloss) -->
                <path d="M 0,1 L 600,1" stroke="rgba(255,255,255,0.7)" stroke-width="1" />
            </svg>

            <!-- ICONOS -->
            <div class="msn-icons-layer">
                <div class="msn-main-icons">
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-invitar.png" alt="Invitar"
                            onerror="this.src='https://placehold.co/28x28/png?text=Inv'">
                        <span>Invitar</span>
                    </a>
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-archivos.png" alt="Archivos"
                            onerror="this.src='https://placehold.co/28x28/png?text=Arc'">
                        <span>Archivos</span>
                    </a>
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-camara.png" alt="Cámara"
                            onerror="this.src='https://placehold.co/28x28/png?text=Cam'">
                        <span>Cámara</span>
                    </a>
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-audio.png" alt="Audio"
                            onerror="this.src='https://placehold.co/28x28/png?text=Aud'">
                        <span>Audio</span>
                    </a>
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-juegos.png" alt="Juegos"
                            onerror="this.src='https://placehold.co/28x28/png?text=Jue'">
                        <span>Juegos</span>
                    </a>
                    <a href="#" class="msn-btn-tool">
                        <img src="images/msn-icon-actividades.png" alt="Actividades"
                            onerror="this.src='https://placehold.co/28x28/png?text=Act'">
                        <span>Actividades</span>
                    </a>
                </div>

                <div class="msn-secondary-icons">
                    <div class="btn-secondary-wrapper" title="Bloquear">
                        <img src="images/msn-icon-block.png" class="msn-small-icon" alt="Block"
                            onerror="this.src='https://placehold.co/12x12/png?text=B'">
                    </div>
                    <div class="btn-secondary-wrapper" title="Manuscrito">
                        <img src="images/msn-icon-pen.png" class="msn-small-icon" alt="Scribble"
                            onerror="this.src='https://placehold.co/12x12/png?text=P'">
                    </div>
                </div>
            </div>

            <div class="msn-branding">
                <img src="images/msn-butterfly.png" alt="msn"
                    onerror="this.src='https://placehold.co/40x16/png?text=msn'">
            </div>

        </div>
        <!-- *** END COMPONENT *** -->

        <div style="height:200px; background:#f0f6ff;"></div>
    </div>

</body>

</html>

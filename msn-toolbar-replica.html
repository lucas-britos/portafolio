<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Toolbar Replica</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        .preview-container {
            width: 600px;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
        }

        /* --- MSN TOOLBAR COMPONENT --- */
        .msn-toolbar {
            height: 55px;
            /* Altura específica */
            background: linear-gradient(to bottom, #ffffff 0%, #f1f4f9 40%, #dae6f6 100%);
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative;
            border-bottom: 1px solid #aebed0;
            overflow: hidden;
            /* Para contener la "ola" */
        }

        /* La "Ola" o Separador Visual */
        .msn-toolbar-wave {
            position: absolute;
            right: 140px;
            /* Posición desde la derecha */
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right,
                    padding-box rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0) 40%,
                    rgba(255, 255, 255, 0.4) 50%,
                    rgba(255, 255, 255, 0) 100%);
            /* Simulación de la forma curva con bordes */
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            border-right: 1px solid rgba(174, 190, 208, 0.3);
            transform: skewX(-15deg);
            /* Inclinación para dar dinamismo */
            pointer-events: none;
        }

        /* Left Actions */
        .msn-actions-left {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-grow: 1;
        }

        .msn-btn-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #0b1f3c;
            /* Azul oscuro casi negro */
            font-size: 10px;
            font-family: Tahoma, sans-serif;
            min-width: 52px;
            height: 52px;
            border: 1px solid transparent;
            border-radius: 3px;
        }

        .msn-btn-tool:hover {
            background: linear-gradient(to bottom, #fff 0%, #eef3fa 100%);
            border-color: #cecee8;
            box-shadow: inset 0 0 2px white;
        }

        .msn-btn-tool img {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
            object-fit: contain;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
            /* Sombra suave íconos */
        }

        .msn-btn-tool span {
            margin-top: -2px;
        }

        /* Secondary Icons (Block/Paint) */
        .msn-actions-secondary {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 20px;
            padding-left: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: -1px 0 0 rgba(0, 0, 0, 0.1);
            /* Separador sutil */
        }

        .msn-small-icon {
            width: 18px;
            height: 18px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .msn-small-icon:hover {
            opacity: 1;
        }

        /* Branding (Right) */
        .msn-branding {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .msn-branding img {
            height: 20px;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="preview-container">
        <!-- HEADER PLACEHOLDER -->
        <div style="height:30px; background:#0058e6; border-radius: 5px 5px 0 0;"></div>
        <div style="height:22px; background:#ece9d8; border-bottom:1px solid #d4d0c8;"></div>

        <!-- *** COMPONENTE TARGET: TOOLBAR *** -->
        <div class="msn-toolbar">
            <!-- La Ola/Separador -->
            <div class="msn-toolbar-wave"></div>

            <div class="msn-actions-left">
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-invitar.png" alt="Invitar"
                        onerror="this.src='https://placehold.co/28x28/png?text=Inv'">
                    <span>Invitar</span>
                </a>
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-archivos.png" alt="Archivos"
                        onerror="this.src='https://placehold.co/28x28/png?text=Arc'">
                    <span>Archivos</span>
                </a>
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-camara.png" alt="Cámara"
                        onerror="this.src='https://placehold.co/28x28/png?text=Cam'">
                    <span>Cámara</span>
                </a>
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-audio.png" alt="Audio"
                        onerror="this.src='https://placehold.co/28x28/png?text=Aud'">
                    <span>Audio</span>
                </a>
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-actividades.png" alt="Actividades"
                        onerror="this.src='https://placehold.co/28x28/png?text=Act'">
                    <span>Actividades</span>
                </a>
                <a href="#" class="msn-btn-tool">
                    <img src="images/msn-icon-juegos.png" alt="Juegos"
                        onerror="this.src='https://placehold.co/28x28/png?text=Jue'">
                    <span>Juegos</span>
                </a>
            </div>

            <!-- Manuscrito / Block -->
            <div class="msn-actions-secondary">
                <img src="images/msn-icon-block.png" class="msn-small-icon" alt="Block"
                    onerror="this.src='https://placehold.co/18x18/png?text=Blk'">
                <img src="images/msn-icon-pen.png" class="msn-small-icon" alt="Scribble"
                    onerror="this.src='https://placehold.co/18x18/png?text=Pen'">
            </div>

            <!-- MSN Logo -->
            <div class="msn-branding">
                <img src="images/msn-butterfly.png" alt="msn"
                    onerror="this.src='https://placehold.co/40x20/png?text=msn'">
            </div>
        </div>
        <!-- *** END COMPONENT *** -->

        <div style="height:200px; background:#f0f6ff;"></div>
    </div>

</body>

</html>

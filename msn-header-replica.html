<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Header Pixel Perfect Replica</title>
    <style>
        /* Reset básico para aislamiento */
        * {
            box-sizing: border-box;
        }

        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
        }

        /* --- COMPONENTE MSN HEADER --- */
        .msn-window-container {
            width: 600px;
            /* Ancho simulado de la ventana */
            background: #f0f0f0;
            /* Fondo temporal del resto de la ventana */
            border-radius: 9px 9px 0 0;
            /* Redondeo superior global */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .msn-title-bar {
            /* 1. GRADIENTE DE FONDO */
            /* Azul MSN clásico: De un azul vibrante a uno un poco más oscuro/profundo */
            background: linear-gradient(to right, #005aff 0%, #004eff 50%, #0043ef 100%);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            border-bottom: 1px solid #001ea0;
            /* Borde oscuro sutil abajo */
            border-radius: 8px 8px 0 0;
            /* Redondeo de la barra */
            position: relative;
        }

        /* 2. ZONA IZQUIERDA (IDENTIDAD) */
        .msn-identity-area {
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .msn-icon {
            width: 16px;
            height: 16px;
            /* Placeholder para el icono del header si no carga */
            background-image: url('images/icons/icon - msn.png');
            background-size: contain;
            background-repeat: no-repeat;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .msn-title-text {
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            font-size: 13px;
            /* Tamaño clásico de títulos XP */
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            /* Sombra dura para legibilidad */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 3. ZONA DERECHA (CONTROLES DE VENTANA) */
        .msn-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .msn-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #ffffff;
            /* Borde blanco característico 'glassy' */
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Botón Minimizar (_) */
        .msn-btn-min {
            background: linear-gradient(to bottom, #448fee 0%, #2f76d8 50%, #0e56ba 51%, #1968d6 100%);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .msn-btn-min::after {
            content: '';
            width: 7px;
            height: 2px;
            background: white;
            position: absolute;
            bottom: 5px;
            /* Posición baja típica de minimizar */
            border-radius: 1px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        /* Botón Maximizar ([ ]) */
        .msn-btn-max {
            background: linear-gradient(to bottom, #448fee 0%, #2f76d8 50%, #0e56ba 51%, #1968d6 100%);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .msn-btn-max::after {
            content: '';
            width: 9px;
            height: 8px;
            border: 2px solid white;
            /* Borde grueso para el cuadrado */
            border-top-width: 3px;
            /* Parte superior más gruesa a veces visualmente */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        /* Botón Cerrar (X) - ROJO */
        .msn-btn-close {
            background: linear-gradient(to bottom, #e06d62 0%, #d84537 50%, #c4291c 51%, #d63d2e 100%);
            border-color: rgba(255, 255, 255, 0.8);
            margin-left: 2px;
            /* Pequeña separación extra */
        }

        .msn-btn-close::before,
        .msn-btn-close::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 2px;
            background: white;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
        }

        .msn-btn-close::before {
            transform: rotate(45deg);
        }

        .msn-btn-close::after {
            transform: rotate(-45deg);
        }

        /* Hover States for fidelity */
        .msn-btn-min:hover,
        .msn-btn-max:hover {
            filter: brightness(1.1);
            box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.6);
        }

        .msn-btn-close:hover {
            filter: brightness(1.1);
            background: linear-gradient(to bottom, #ec8b82 0%, #e26357 50%, #d24235 51%, #e05345 100%);
        }

        .msn-btn:active {
            transform: translateY(1px);
            filter: brightness(0.9);
        }
    </style>
</head>

<body>

    <div class="msn-window-container">
        <!-- HEADER COMPONENT START -->
        <div class="msn-title-bar">
            <!-- Left: Icon & Identity -->
            <div class="msn-identity-area">
                <!-- Icono MSN pequeño -->
                <img src="images/icons/icon - msn.png" class="msn-icon" alt=""
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <!-- Texto del título -->
                <span class="msn-title-text">&gt;&gt;Lucas_Britos&lt;&lt;</span>
                <!-- Simulación nombre de usuario estilo 2005 -->
            </div>

            <!-- Right: Controls -->
            <div class="msn-controls">
                <div class="msn-btn msn-btn-min" title="Minimizar"></div>
                <div class="msn-btn msn-btn-max" title="Maximizar"></div>
                <div class="msn-btn msn-btn-close" title="Cerrar"></div>
            </div>
        </div>
        <!-- HEADER COMPONENT END -->
    </div>

</body>

</html>

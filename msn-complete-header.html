<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Complete Authentic Header</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        /* --- CONTENEDOR CÁPSULA (THE WRAPPER) --- */
        .msn-capsule-wrapper {
            width: 600px;
            /* Esquinas redondeadas SUPERIORES OBLIGATORIAS */
            border-top-left-radius: 9px;
            border-top-right-radius: 9px;
            overflow: hidden;
            /* Clave para recortar los hijos */
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 15px 35px rgba(0, 0, 0, 0.7);
            /* Borde exterior sutil */
            border: 1px solid #001f9c;
            background: #fff;
        }

        /* --- TIER 1: TITLE BAR (Azul Oscuro Glossy) --- */
        .msn-title-bar {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            position: relative;
            z-index: 10;
            /* Encima de la toolbar */

            /* GLOSSY VERTICAL GRADIENT (Plastic Curve Effect) */
            background: linear-gradient(to bottom,
                    #0059f1 0%,
                    /* Azul brillante tope */
                    #2f86ff 10%,
                    /* Highlight (reflejo de luz) */
                    #004ed3 40%,
                    /* Cuerpo principal */
                    #003ec0 95%,
                    /* Oscurecimiento abajo */
                    #002b75 100%
                    /* Borde visual */
                );

            /* Sombra inferior para proyectar sobre Tier 2 */
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid #002b75;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msn-icon-small {
            width: 16px;
            height: 16px;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .title-text {
            color: #fff;
            font-size: 13px;
            /* Tamaño correcto XP */
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
        }

        /* Window Controls */
        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #fff;
            border-radius: 3px;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            position: relative;
        }

        .btn-blue {
            background: linear-gradient(to bottom, #4ea3ff 0%, #0046d5 100%);
        }

        .btn-red {
            background: linear-gradient(to bottom, #ff7c6a 0%, #c31d1d 100%);
        }

        .icon-min::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 2px;
            background: #fff;
            bottom: 5px;
            left: 6px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
        }

        .icon-max::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 8px;
            border: 2px solid #fff;
            border-top-width: 3px;
            top: 5px;
            left: 5px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
        }

        .icon-close::before,
        .icon-close::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 2px;
            background: #fff;
            top: 8px;
            left: 4px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
        }

        .icon-close::before {
            transform: rotate(45deg);
        }

        .icon-close::after {
            transform: rotate(-45deg);
        }


        /* --- TIER 2: TOOLBAR CONTAINER (Celeste Claro + SVG Wave) --- */
        .msn-toolbar-container {
            position: relative;
            height: 52px;
            /* Altura fija */
            width: 100%;
            /* El fondo "cielo" detrás de la ola blanca */
            background: linear-gradient(to bottom, #eff4fb 0%, #dce6f5 100%);

            /* BEVEL SUPERIOR (Unión con Tier 1) */
            /* Borde superior claro + sombra interna oscura = Efecto Ranura */
            border-top: 1px solid #fff;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.1);

            border-bottom: 1px solid #9cb4d4;
            overflow: hidden;
            /* Recortar el SVG si sobra */
        }

        /* EL SVG QUE DIBUJA LA "OLA" BLANCA (FOREGROUND) */
        .msn-wave-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* CAPA DE ICONOS (Encima del SVG) */
        .msn-icons-layer {
            position: relative;
            z-index: 5;
            display: flex;
            height: 100%;
        }

        /* 1. Iconos Principales (Zona Izquierda/Alta) */
        .main-icons-group {
            display: flex;
            gap: 0;
            padding-left: 5px;
            padding-top: 2px;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 48px;
            border-radius: 3px;
            text-decoration: none;
            color: #0b1f3c;
            font-size: 10px;
        }

        .tool-btn:hover {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .tool-btn img {
            width: 27px;
            height: 27px;
            margin-bottom: 1px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
        }

        /* 2. Iconos Secundarios (Zona Derecha/Fina/Shelf) */
        .secondary-icons-group {
            position: absolute;
            right: 80px;
            /* Ajustar posición horizontal */
            top: 6px;
            /* Ajustar posición vertical en el "shelf" */
            display: flex;
            gap: 8px;
        }

        .sec-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
            border: 1px solid #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sec-btn:hover {
            filter: brightness(1.05);
        }

        .sec-btn img {
            width: 12px;
            height: 12px;
        }

        /* MSN Logo */
        .msn-logo-branding {
            position: absolute;
            right: 10px;
            top: 6px;
            z-index: 5;
        }

        .msn-logo-branding img {
            height: 16px;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
        }
    </style>
</head>

<body>

    <!-- COMPOSITE HEADER START -->
    <div class="msn-capsule-wrapper">

        <!-- TIER 1: TITLE BAR -->
        <div class="msn-title-bar">
            <div class="title-left">
                <!-- Icono MSN -->
                <img src="images/icons/icon - msn.png" class="msn-icon-small" alt=""
                    onerror="this.src='https://placehold.co/16x16/png?text=M'">
                <span class="title-text">Conversación</span>
            </div>

            <div class="window-controls">
                <div class="win-btn btn-blue icon-min" title="Minimizar"></div>
                <div class="win-btn btn-blue icon-max" title="Maximizar"></div>
                <div class="win-btn btn-red icon-close" title="Cerrar"></div>
            </div>
        </div>

        <!-- TIER 2: TOOLBAR + WAVE -->
        <div class="msn-toolbar-container">

            <!-- EL SVG DE LA "OLA" (V5 Blueprint) -->
            <svg class="msn-wave-svg" viewBox="0 0 600 52" preserveAspectRatio="none">
                <defs>
                    <!-- Gradiente Blanco Plástico -->
                    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#f4f8fe" />
                        <stop offset="100%" stop-color="#daecf6" />
                    </linearGradient>
                </defs>

                <!-- 
                    PATH V5: Left Thick -> Right Thin -> Top Aligned
                    La curva conecta la parte gruesa inferior (y=50) con la fina derecha (y=26)
                -->
                <path d="
                    M -1,-1        <!-- Start Top Left (fuera del box) -->
                    L 601,-1       <!-- Top Right -->
                    L 601,26       <!-- Bajar por derecha hasta nivel fino (y=26) -->
                    L 450,26       <!-- Línea recta inferior derecha -->
                    C 430,26 420,28 400,53  <!-- CURVA SUAVE HACIA ABAJO -->
                    L -1,53        <!-- Línea recta inferior izquierda (Gruesa) -->
                    Z" fill="url(#waveGradient)" stroke="#acc2de" stroke-width="1.2" />
            </svg>

            <!-- CAPA DE ICONOS -->
            <div class="msn-icons-layer">
                <div class="main-icons-group">
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-invitar.png" alt="Invitar"
                            onerror="this.src='https://placehold.co/28x28/png?text=Inv'">
                        <span>Invitar</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-archivos.png" alt="Archivos"
                            onerror="this.src='https://placehold.co/28x28/png?text=F'">
                        <span>Archivos</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-camara.png" alt="Cámara"
                            onerror="this.src='https://placehold.co/28x28/png?text=C'">
                        <span>Cámara</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-audio.png" alt="Audio"
                            onerror="this.src='https://placehold.co/28x28/png?text=A'">
                        <span>Audio</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-juegos.png" alt="Juegos"
                            onerror="this.src='https://placehold.co/28x28/png?text=J'">
                        <span>Juegos</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-actividades.png" alt="Actividades"
                            onerror="this.src='https://placehold.co/28x28/png?text=Ac'">
                        <span>Actividades</span>
                    </a>
                </div>

                <div class="secondary-icons-group">
                    <div class="sec-btn" title="Bloquear">
                        <img src="images/msn-icon-block.png" alt="B"
                            onerror="this.src='https://placehold.co/12x12/png?text=B'">
                    </div>
                    <div class="sec-btn" title="Manuscrito">
                        <img src="images/msn-icon-pen.png" alt="P"
                            onerror="this.src='https://placehold.co/12x12/png?text=P'">
                    </div>
                </div>

                <div class="msn-logo-branding">
                    <img src="images/msn-butterfly.png" alt="msn"
                        onerror="this.src='https://placehold.co/40x16/png?text=msn'">
                </div>
            </div>

        </div> <!-- END TIER 2 -->

    </div> <!-- END CAPSULE -->

    <!-- Contenido simulado abajo -->
    <div style="width: 600px; height: 100px; background: #fff; border:1px solid #001f9c; border-top:none;"></div>

</body>

</html>

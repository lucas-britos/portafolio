<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Header Sketch Match</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        /* --- WRAPPER (Rounded Top) --- */
        .msn-capsule-wrapper {
            width: 600px;
            border-top-left-radius: 9px;
            border-top-right-radius: 9px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid #001f9c;
            /* IMPORTANTE: Fondo blanco/neutro base que se verá en el recorte */
            background: #fff;
        }

        /* --- TIER 1: TITLE BAR --- */
        .msn-title-bar {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            background: linear-gradient(to bottom,
                    #0059f1 0%, #3a87ff 8%, #004ed3 40%, #003ec0 95%, #002b75 100%);
            border-bottom: 1px solid #002b75;
            position: relative;
            z-index: 10;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msn-icon-small {
            width: 16px;
            height: 16px;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .title-text {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #fff;
            border-radius: 3px;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            position: relative;
        }

        .btn-blue {
            background: linear-gradient(to bottom, #4ea3ff 0%, #0046d5 100%);
        }

        .btn-red {
            background: linear-gradient(to bottom, #ff7c6a 0%, #c31d1d 100%);
        }

        .icon-min::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 2px;
            background: #fff;
            bottom: 5px;
            left: 6px;
        }

        .icon-max::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 8px;
            border: 2px solid #fff;
            border-top-width: 3px;
            top: 5px;
            left: 5px;
        }

        .icon-close::before,
        .icon-close::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 2px;
            background: #fff;
            top: 8px;
            left: 4px;
        }

        .icon-close::before {
            transform: rotate(45deg);
        }

        .icon-close::after {
            transform: rotate(-45deg);
        }


        /* --- TIER 2: TOOLBAR WITH REAL CUTOUT --- */
        .msn-toolbar-tier {
            position: relative;
            height: 55px;
            /* Altura del area */
            width: 100%;
            /* SIN BACKGROUD: Para que el recorte sea transparente */
            background: transparent;
        }

        /* SVG BACKGROUND - Draws the Shape */
        .toolbar-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* DIVISOR DE ESTRUCTURA */
        /* Esta línea simula el borde superior blanco entre Tier 1 y Tier 2, pero SOLO donde hay SVG */
        .tier-separator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
            z-index: 2;
        }

        .toolbar-content {
            position: relative;
            z-index: 5;
            display: flex;
            height: 100%;
        }

        .main-icons {
            display: flex;
            padding-left: 5px;
            padding-top: 2px;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 48px;
            border-radius: 3px;
            text-decoration: none;
            color: #0b1f3c;
            font-size: 10px;
        }

        .tool-btn:hover {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .tool-btn img {
            width: 27px;
            height: 27px;
            margin-bottom: 1px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
        }

        .secondary-icons {
            position: absolute;
            right: 80px;
            top: 6px;
            display: flex;
            gap: 8px;
        }

        .sec-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
            border: 1px solid #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sec-btn:hover {
            filter: brightness(1.05);
        }

        .sec-btn img {
            width: 12px;
            height: 12px;
        }

        .msn-logo-branding {
            position: absolute;
            right: 10px;
            top: 6px;
            z-index: 5;
        }

        .msn-logo-branding img {
            height: 16px;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
        }

        /* MOCK CONTENT BEHIND CUTOUT */
        .content-mock {
            height: 100px;
            background: #fff;
            /* Borde superior que simula el inicio del chat, alineado con el recorte */
            position: relative;
            top: -20px;
            z-index: 0;
            border-top: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <div class="msn-capsule-wrapper">
        <div class="msn-title-bar">
            <div class="title-left">
                <img src="images/icons/icon - msn.png" class="msn-icon-small" alt=""
                    onerror="this.src='https://placehold.co/16x16/png?text=M'">
                <span class="title-text">Conversación</span>
            </div>
            <div class="window-controls">
                <div class="win-btn btn-blue icon-min"></div>
                <div class="win-btn btn-blue icon-max"></div>
                <div class="win-btn btn-red icon-close"></div>
            </div>
        </div>

        <div class="msn-toolbar-tier">
            <!-- SVG MATCHING SKETCH EXACTLY -->
            <svg class="toolbar-svg-layer" viewBox="0 0 600 55" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="sketchGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="70%" stop-color="#f0f6fd" />
                        <stop offset="100%" stop-color="#d6e7f7" />
                    </linearGradient>
                    <!-- Shadow to lift the shape off the background -->
                    <filter id="liftShadow" x="-5%" y="-5%" width="110%" height="120%">
                        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.2)" />
                    </filter>
                </defs>

                <!-- 
                   BLUEPRINT PATH (Based on Red Drawing):
                   - Left side (x=0 to x=380): Full Height (y=53).
                   - Step Up (x=380 to x=430): Diagonal go UP to y=25.
                   - Right side (x=430 to x=600): Half Height (y=25).
                   - Top side (y=0): Straight.
                   - Area (430-600, 25-55) is EMPTY/TRANSPARENT.
                -->
                <path d="
                    M 0,0           
                    L 600,0         
                    L 600,25        /* Right Wall ends at Thin Height */
                    L 430,25        /* Right Bottom Edge */
                    L 380,53        /* DIAGONAL STEP DOWN (Sharp, not curved) */
                    L 0,53          /* Left Bottom Edge */
                    Z" fill="url(#sketchGradient)" stroke="#a4b8d1" stroke-width="0.8" filter="url(#liftShadow)" />
            </svg>

            <div class="toolbar-content">
                <div class="main-icons">
                    <!-- Icons here -->
                    <a href="#" class="tool-btn"><img src="images/msn-icon-invitar.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=Inv'"><span>Invitar</span></a>
                    <a href="#" class="tool-btn"><img src="images/msn-icon-archivos.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=F'"><span>Archivos</span></a>
                    <a href="#" class="tool-btn"><img src="images/msn-icon-camara.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=C'"><span>Cámara</span></a>
                    <a href="#" class="tool-btn"><img src="images/msn-icon-audio.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=A'"><span>Audio</span></a>
                    <a href="#" class="tool-btn"><img src="images/msn-icon-juegos.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=J'"><span>Juegos</span></a>
                    <a href="#" class="tool-btn"><img src="images/msn-icon-actividades.png"
                            onerror="this.src='https://placehold.co/28x28/png?text=Ac'"><span>Activ.</span></a>
                </div>
                <div class="secondary-icons">
                    <div class="sec-btn"><img src="images/msn-icon-block.png"
                            onerror="this.src='https://placehold.co/12x12/png?text=B'"></div>
                    <div class="sec-btn"><img src="images/msn-icon-pen.png"
                            onerror="this.src='https://placehold.co/12x12/png?text=P'"></div>
                </div>
                <div class="msn-logo-branding">
                    <img src="images/msn-butterfly.png" onerror="this.src='https://placehold.co/40x16/png?text=msn'">
                </div>
            </div>
        </div>
    </div>

    <!-- DEMO BACKGROUND CONTENT TO PROVE TRANSPARENCY -->
    <div
        style="width: 598px; margin-top:-25px; height: 100px; background: #e0e9f6; border:1px solid #ccc; text-align:center; padding-top:40px; border-radius: 0 0 5px 5px; position:relative; z-index:-1;">
        Contenido del Chat (Fondo visible por el recorte)
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Header Final Fix</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Para centrar en la pantalla de prueba */
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        /* --- THE CAPSULE WRAPPER --- */
        .msn-capsule-wrapper {
            width: 600px;
            /* Ancho fijo para demo */
            /* Esquinas redondeadas arriba */
            border-top-left-radius: 9px;
            border-top-right-radius: 9px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3), 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid #001f9c;
            background: #fff;
        }

        /* --- TIER 1: TITLE BAR --- */
        .msn-title-bar {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            /* Glossy Gradient Vertical */
            background: linear-gradient(to bottom,
                    #0059f1 0%,
                    #3a87ff 8%,
                    #004ed3 40%,
                    #003ec0 95%,
                    #002b75 100%);
            /* Línea de separación inferior */
            border-bottom: 1px solid #002b75;
            position: relative;
            z-index: 10;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msn-icon-small {
            width: 16px;
            height: 16px;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .title-text {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #fff;
            border-radius: 3px;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            position: relative;
        }

        .btn-blue {
            background: linear-gradient(to bottom, #4ea3ff 0%, #0046d5 100%);
        }

        .btn-red {
            background: linear-gradient(to bottom, #ff7c6a 0%, #c31d1d 100%);
        }

        /* Iconos CSS */
        .icon-min::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 2px;
            background: #fff;
            bottom: 5px;
            left: 6px;
        }

        .icon-max::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 8px;
            border: 2px solid #fff;
            border-top-width: 3px;
            top: 5px;
            left: 5px;
        }

        .icon-close::before,
        .icon-close::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 2px;
            background: #fff;
            top: 8px;
            left: 4px;
        }

        .icon-close::before {
            transform: rotate(45deg);
        }

        .icon-close::after {
            transform: rotate(-45deg);
        }


        /* --- TIER 2: TOOLBAR (THE COMPLEX SHAPE) --- */
        .msn-toolbar-tier {
            position: relative;
            height: 55px;
            /* Altura total máxima */
            width: 100%;
            /* Gradient fondo "Cielo" (detrás de todo) */
            background: linear-gradient(to bottom, #eff4fb 0%, #dce6f5 100%);
            /* Borde superior blanco + sombra interna para efecto de "ranura" */
            border-top: 1px solid #fff;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid #9cb4d4;
        }

        /* EL SVG QUE DEFINE LA FORMA TOP-ALIGNED + INVERTED V3 STYE */
        .toolbar-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* CONTENIDO DE ICONOS */
        .toolbar-content {
            position: relative;
            z-index: 5;
            display: flex;
            height: 100%;
        }

        /* 1. MAIN ICONS (Left Area - Thick) */
        .main-icons {
            display: flex;
            padding-left: 5px;
            padding-top: 2px;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 48px;
            border-radius: 3px;
            text-decoration: none;
            color: #0b1f3c;
            font-size: 10px;
        }

        .tool-btn:hover {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .tool-btn img {
            width: 27px;
            height: 27px;
            margin-bottom: 1px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
        }

        /* 2. SECONDARY ICONS (Right Area - Thin & High) */
        .secondary-icons {
            position: absolute;
            right: 80px;
            top: 6px;
            /* Flotando arriba */
            display: flex;
            gap: 8px;
        }

        .sec-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
            border: 1px solid #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sec-btn:hover {
            filter: brightness(1.05);
        }

        .sec-btn img {
            width: 12px;
            height: 12px;
        }

        .msn-logo-branding {
            position: absolute;
            right: 10px;
            top: 6px;
            z-index: 5;
        }

        .msn-logo-branding img {
            height: 16px;
            filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
        }
    </style>
</head>

<body>

    <div class="msn-capsule-wrapper">

        <!-- TIER 1 -->
        <div class="msn-title-bar">
            <div class="title-left">
                <img src="images/icons/icon - msn.png" class="msn-icon-small" alt=""
                    onerror="this.src='https://placehold.co/16x16/png?text=M'">
                <span class="title-text">Conversación</span>
            </div>
            <div class="window-controls">
                <div class="win-btn btn-blue icon-min"></div>
                <div class="win-btn btn-blue icon-max"></div>
                <div class="win-btn btn-red icon-close"></div>
            </div>
        </div>

        <!-- TIER 2 -->
        <div class="msn-toolbar-tier">
            <!-- SVG SHAPE: Top filled. Bottom edge curves UP. -->
            <svg class="toolbar-svg-layer" viewBox="0 0 600 55" preserveAspectRatio="none">
                <defs>
                    /* Gradiente V3 (Plastic White) que gustó */
                    <linearGradient id="v3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#f4f8fe" />
                        <stop offset="100%" stop-color="#daecf6" />
                    </linearGradient>
                </defs>

                <!-- 
                   TOP ALIGNED PATH:
                   Starts Top-Left (0,0). Goes to Bottom-Left (0,53).
                   Bottom Edge is straight until x=400.
                   Then curves UP ("Step Up") to y=28.
                   Then continues straight to Right Edge (600,28).
                   Goes up to Top-Right (600,0).
                   Closes at Top-Left.
                   
                   THIS is "Inverted V3". V3 was Bottom-Filled. This is Top-Filled.
                -->
                <path d="
                    M 0,0           
                    L 600,0         
                    L 600,28        /* Right: Thin Height */
                    L 450,28        /* Start of curve on right */
                    C 430,28 420,30 400,53  /* Curve DOWN to left */
                    L 0,53          /* Left: Thick Height */
                    L 0,0
                    Z" fill="url(#v3Gradient)" /* Sutil borde inferior para definición */ stroke="#acc2de"
                    stroke-width="0.5" />
            </svg>

            <div class="toolbar-content">
                <div class="main-icons">
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-invitar.png" alt="Invitar"
                            onerror="this.src='https://placehold.co/28x28/png?text=Inv'">
                        <span>Invitar</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-archivos.png" alt="Archivos"
                            onerror="this.src='https://placehold.co/28x28/png?text=F'">
                        <span>Archivos</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-camara.png" alt="Cámara"
                            onerror="this.src='https://placehold.co/28x28/png?text=C'">
                        <span>Cámara</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-audio.png" alt="Audio"
                            onerror="this.src='https://placehold.co/28x28/png?text=A'">
                        <span>Audio</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-juegos.png" alt="Juegos"
                            onerror="this.src='https://placehold.co/28x28/png?text=J'">
                        <span>Juegos</span>
                    </a>
                    <a href="#" class="tool-btn">
                        <img src="images/msn-icon-actividades.png" alt="Actividades"
                            onerror="this.src='https://placehold.co/28x28/png?text=Ac'">
                        <span>Actividades</span>
                    </a>
                </div>

                <div class="secondary-icons">
                    <div class="sec-btn" title="Bloquear">
                        <img src="images/msn-icon-block.png" alt="B"
                            onerror="this.src='https://placehold.co/12x12/png?text=B'">
                    </div>
                    <div class="sec-btn" title="Manuscrito">
                        <img src="images/msn-icon-pen.png" alt="P"
                            onerror="this.src='https://placehold.co/12x12/png?text=P'">
                    </div>
                </div>

                <div class="msn-logo-branding">
                    <img src="images/msn-butterfly.png" alt="msn"
                        onerror="this.src='https://placehold.co/40x16/png?text=msn'">
                </div>
            </div>

        </div>

    </div>

</body>

</html>

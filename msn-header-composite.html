<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MSN Two-Tiered Glossy Header</title>
    <style>
        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        /* --- CONTENEDOR PRINCIPAL "CAPSULA" --- */
        .msn-capsule-header {
            width: 600px;
            /* Esquinas superiores muy redondeadas */
            border-top-left-radius: 9px;
            border-top-right-radius: 9px;
            overflow: hidden;
            /* Para que los hijos respeten el borde */
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4), 0 10px 30px rgba(0, 0, 0, 0.6);
            /* Borde exterior sutil general */
            border: 1px solid #002D96;
            background: #fff;
        }

        /* --- TIER 1: BARRA DE TÍTULO (Glossy Dark Blue) --- */
        .msn-tier-1-title {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            position: relative;

            /* GLOSSY VERTICAL GRADIENT */
            /* Azul oscuro -> Azul medio (brillo) -> Azul oscuro */
            background: linear-gradient(to bottom,
                    #0058e6 0%,
                    #3a87ff 8%,
                    /* Highlight superior */
                    #004ed3 40%,
                    #0043c2 100%);

            /* Borde inferior suave para separar del Tier 2 */
            border-bottom: 1px solid #002b75;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msn-icon-small {
            width: 16px;
            height: 16px;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .title-text {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
            /* Sombra dura XP */
            letter-spacing: 0.5px;
        }

        /* Window Controls (Min/Max/Close) */
        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 21px;
            height: 21px;
            border: 1px solid #fff;
            border-radius: 3px;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.7);
            cursor: pointer;
            position: relative;
        }

        .btn-blue {
            background: linear-gradient(to bottom, #4ea3ff 0%, #0046d5 100%);
        }

        .btn-red {
            background: linear-gradient(to bottom, #ff7c6a 0%, #c31d1d 100%);
        }

        /* Iconografía CSS para los botones */
        .icon-min::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 2px;
            background: #fff;
            bottom: 5px;
            left: 6px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
        }

        .icon-max::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 8px;
            border: 2px solid #fff;
            border-top-width: 3px;
            top: 5px;
            left: 5px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
        }

        .icon-close::before,
        .icon-close::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 2px;
            background: #fff;
            top: 8px;
            left: 4px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
        }

        .icon-close::before {
            transform: rotate(45deg);
        }

        .icon-close::after {
            transform: rotate(-45deg);
        }


        /* --- TIER 2: BARRA DE HERRAMIENTAS (Lighter + Bevel) --- */
        .msn-tier-2-toolbar {
            height: 38px;
            /* Un poco más alto para los iconos */
            display: flex;
            align-items: center;
            padding-left: 8px;

            /* LIGHTER GLOSSY GRADIENT */
            /* Celeste grisáceo a blanco y vuelta a celeste */
            background: linear-gradient(to bottom,
                    #f1f6fc 0%,
                    #ffffff 40%,
                    #dcecfa 100%);

            /* BEVEL EFFECT (Hundido) */
            /* Sombra interna arriba para simular que está "debajo" del título */
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1px 0 rgba(255, 255, 255, 0.4);

            border-bottom: 1px solid #a0b3ce;
            /* Borde inferior de la toolbar */
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border: 1px solid transparent;
            /* Reserva espacio para borde hover */
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            font-size: 11px;
            user-select: none;
            height: 28px;
        }

        .tool-btn:hover {
            background: linear-gradient(to bottom, #fff 0%, #eef3fa 100%);
            border-color: #cecee8;
            box-shadow: inset 0 0 1px #fff;
        }

        .tool-btn img {
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        /* DIVIDERS */
        .divider {
            width: 1px;
            height: 20px;
            background: #aabccf;
            margin: 0 4px;
            border-right: 1px solid #fff;
            /* Efecto relieve en el separador */
        }
    </style>
</head>

<body>

    <!-- COMPOSITE HEADER START -->
    <div class="msn-capsule-header">

        <!-- TIER 1: TITLE BAR -->
        <div class="msn-tier-1-title">
            <div class="title-left">
                <!-- Icono MSN Pequeño -->
                <img src="images/icons/icon - msn.png" class="msn-icon-small" alt=""
                    onerror="this.src='https://placehold.co/16x16/png?text=M'">
                <span class="title-text">Conversación</span>
            </div>

            <div class="window-controls">
                <div class="win-btn btn-blue icon-min"></div>
                <div class="win-btn btn-blue icon-max"></div>
                <div class="win-btn btn-red icon-close"></div>
            </div>
        </div>

        <!-- TIER 2: TOOLBAR (Beveled) -->
        <div class="msn-tier-2-toolbar">
            <div class="toolbar-group">
                <div class="tool-btn">
                    <img src="images/msn-icon-invitar.png" alt=""
                        onerror="this.src='https://placehold.co/20x20/png?text=Inv'">
                    <span>Invitar</span>
                </div>
                <div class="divider"></div>

                <div class="tool-btn">
                    <img src="images/msn-icon-archivos.png" alt=""
                        onerror="this.src='https://placehold.co/20x20/png?text=Fil'">
                    <span>Enviar archivos</span>
                </div>
                <!-- Sin divisor aquí según estilo XP a veces, o agregamos otro -->
                <div class="divider"></div>

                <div class="tool-btn">
                    <img src="images/msn-icon-camara.png" alt=""
                        onerror="this.src='https://placehold.co/20x20/png?text=Cam'">
                    <span>Webcam</span>
                </div>
                <div class="divider"></div>

                <div class="tool-btn">
                    <img src="images/msn-icon-audio.png" alt=""
                        onerror="this.src='https://placehold.co/20x20/png?text=Aud'">
                    <span>Audio</span>
                </div>
            </div>

            <!-- MSN Logo a la derecha si es necesario -->
            <div style="margin-left: auto; padding-right: 10px;">
                <img src="images/msn-butterfly.png" alt="" style="height: 16px; opacity:0.8;"
                    onerror="this.style.display='none'">
            </div>
        </div>

    </div>
    <!-- COMPOSITE HEADER END -->

</body>

</html>
